[package]
name = "tsuji"
version = "0.2.0"
edition = "2021"
description = "Local file-based inter-session chat CLI for Claude Code"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ulid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4"
anyhow = "1"
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
jsonschema = "0.18"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
